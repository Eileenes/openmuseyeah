[package]
name = "vesper"
version = "0.1.0"
description = "Vesper desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
# The mobile entry point expects a library target, and keeping the shell in a
# library makes it reachable from tests later.
name = "vesper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
